# Business module gateway integration
# Extension implementations, discovered and instantiated by the gateway.
#
# Syntax: ONE extension per line, "<n>" only expresses load order.
#   module.extensions.<n>=<fully qualified class name>
#   - <n> MUST be unique, gaps are allowed. Keep steps of 10 (10/20/30...)
#     so that a new extension can be inserted WITHOUT renumbering the rest,
#     and add/remove of one extension is a single-line diff.
#   - Extensions are loaded in ASCENDING <n> order. Load order is also the
#     endpoint registration order and the tie-break for conflicts
#     (first registration wins, later duplicate logs ERROR and is skipped).
#   - To disable ONE extension, comment out its own line only.
#   - The old form "module.extensions=A,B,C" is still accepted but deprecated;
#     if any "module.extensions.<n>" entry exists, the comma list is ignored.
#
# Two kinds of extension, both listed here:
#   1. Prefix declaration only (getRestPrefixes) — used for conflict diagnostics
#      and for the module fallback channel below.
#   2. Endpoint provider (getEndpointHandlers) — returns the module's own Jetty
#      ContextHandler instances. The gateway registers them AFTER its own
#      handlers, de-duplicating by context path (first registration wins), so
#      the gateway never has to import any module type.
#
# The module jars depend on cube-dispatcher-*.jar at compile time (they must,
# in order to construct the handlers). The dependency is one-way: the gateway
# side references nothing from the modules.
module.extensions.1=cube.service.psychology.PsychologyDispatcherExtension
module.extensions.2=cube.service.psychology.dispatcher.PsychologyEndpoints
module.extensions.3=cube.service.forest.dispatcher.ForestEndpoints

# Fallback channel for module actions: POST /aigc/module/{moduleName}/{actionName}
# Default false: when off, the path is not registered at all and
# behaviour is identical to before pluginization.
# Dedicated endpoints under /aigc/psychology are always kept and are NOT
# replaced by this channel.
module.rest.enabled=false

# OpenAI / Claude compatibility routes (restart dispatcher after changes)
completion.rest.enabled=true
completion.rest.timeout.seconds=300
completion.rest.body.bytes=33554432
completion.rest.buffer.events=256
completion.rest.buffer.bytes=4194304

# Harness
harness.rest.enabled=true
