# AI 单元概览接口（/statistic/units）
# 台账统计来自统计库且不随节点上报变化，因此可缓存；在线状态与能力实时叠加，不入缓存
statistic.units.require.auth=true
statistic.units.cache.ttl=120000
statistic.units.cache.stale=600000
statistic.units.cache.max.entries=32
statistic.units.cache.max.units=50000
statistic.units.cache.merge.timeout=10000
# 允许同时进行的回源数量
statistic.units.concurrent.permits=4
# 真正打统计库的全局配额（每分钟）
statistic.units.rate.global.per.minute=300
# 单用户配额（同一用户的多个标签页共享）与突发量
statistic.units.rate.user.per.minute=12
statistic.units.rate.user.burst=12
# 单 IP 兜底配额与突发量
statistic.units.rate.ip.per.minute=60
statistic.units.rate.ip.burst=60
# 单域可承载的单元数上限，超出时接口返回 503（不静默截断）；0 表示不限
statistic.units.max.contacts=50000
