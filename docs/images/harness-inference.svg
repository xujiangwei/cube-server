<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 5 z" fill="#94A3B8"/>
    </marker>
    <marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 5 z" fill="#7C3AED"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 5 z" fill="#2563EB"/>
    </marker>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 5 z" fill="#0D9488"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="600" rx="12" fill="#FFFFFF"/>
  <text x="40" y="36" font-size="15" font-weight="700" fill="#1E293B">Harness 推理链（N06 / N07，execution.enabled=true 时启用）</text>

  <!-- main flow -->
  <g>
    <rect x="40" y="64" width="170" height="76" rx="10" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="125" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">用户 Prompt</text>
    <text x="125" y="118" text-anchor="middle" font-size="11" fill="#A16208">POST /harness/v1/runs</text>

    <rect x="248" y="64" width="200" height="76" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="348" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">Java Harness</text>
    <text x="348" y="112" text-anchor="middle" font-size="11" fill="#7C3AED">受理 · 上下文 · 任务</text>
    <text x="348" y="130" text-anchor="middle" font-size="11" fill="#7C3AED">幂等键 · 事务创建</text>

    <rect x="486" y="64" width="200" height="76" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="586" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#6D28D9">Python Harness</text>
    <text x="586" y="112" text-anchor="middle" font-size="11" fill="#7C3AED">消息 · 编排</text>
    <text x="586" y="130" text-anchor="middle" font-size="11" fill="#7C3AED">worker 租约 · journal</text>

    <rect x="724" y="64" width="170" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="809" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">Cell v3</text>
    <text x="809" y="112" text-anchor="middle" font-size="11" fill="#2563EB">inference_submit</text>
    <text x="809" y="130" text-anchor="middle" font-size="11" fill="#2563EB">poll / cancel</text>

    <rect x="932" y="64" width="188" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <text x="1026" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">InferenceGateway</text>
    <text x="1026" y="112" text-anchor="middle" font-size="11" fill="#2563EB">ModelProfile 选模型</text>
    <text x="1026" y="130" text-anchor="middle" font-size="11" fill="#2563EB">容量认领 · backend 锁定</text>
  </g>

  <line x1="210" y1="102" x2="244" y2="102" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#aP)"/>
  <line x1="448" y1="102" x2="482" y2="102" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#aP)"/>
  <line x1="686" y1="102" x2="720" y2="102" stroke="#2563EB" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="894" y1="102" x2="928" y2="102" stroke="#2563EB" stroke-width="1.5" marker-end="url(#aB)"/>

  <!-- branches -->
  <line x1="1026" y1="140" x2="1026" y2="176" stroke="#2563EB" stroke-width="1.5" marker-end="url(#aB)"/>
  <line x1="1026" y1="176" x2="420" y2="176" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="420" y1="176" x2="420" y2="212" stroke="#0D9488" stroke-width="1.5" marker-end="url(#aT)"/>
  <line x1="1026" y1="176" x2="760" y2="176" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="760" y1="176" x2="760" y2="212" stroke="#D97706" stroke-width="1.5" marker-end="url(#aG)"/>
  <text x="600" y="168" font-size="11" fill="#64748B">两种物理后端（ModelProfile.nativeTools 声明能力，不能按名称猜测）</text>

  <rect x="220" y="216" width="400" height="80" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="420" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">默认 backend：同 JVM AIGCService</text>
  <text x="420" y="262" text-anchor="middle" font-size="11" fill="#475569">CompletionProvider 内部接口（无需 TalkContext）</text>
  <text x="420" y="282" text-anchor="middle" font-size="11" fill="#475569">已注册 Baize / Baize2 模型单元 · Unit 队列</text>

  <rect x="660" y="216" width="400" height="80" rx="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="860" y="242" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">显式 type=openai：外部 HTTP 服务</text>
  <text x="860" y="262" text-anchor="middle" font-size="11" fill="#A16208">baseUrl / model / token / capacity 由 Java 配置</text>
  <text x="860" y="282" text-anchor="middle" font-size="11" fill="#A16208">JSON / SSE · 整体截止时间 · 实际 usage 校验</text>

  <!-- converge -->
  <line x1="420" y1="296" x2="420" y2="336" stroke="#0D9488" stroke-width="1.5"/>
  <line x1="760" y1="296" x2="760" y2="336" stroke="#D97706" stroke-width="1.5"/>
  <line x1="420" y1="336" x2="760" y2="336" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="590" y1="336" x2="590" y2="368" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#aG)"/>

  <rect x="380" y="372" width="420" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="590" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Java 持久化推理结果 + usage（权威账本）</text>
  <text x="590" y="416" text-anchor="middle" font-size="11" fill="#475569">忽略 Python 对物理结束及用量的自行断言；缺失 usage 不估算</text>
  <text x="590" y="434" text-anchor="middle" font-size="11" fill="#475569">inference_store / model journal · schema=4 独立 RunStore</text>

  <!-- return path -->
  <path d="M 380 408 L 300 408 L 300 102 L 244 102" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#aP)"/>
  <text x="308" y="250" font-size="11" fill="#6D28D9" transform="rotate(-90 308 250)">决策回传：Python 提交处理后决策</text>

  <line x1="800" y1="408" x2="880" y2="408" stroke="#0D9488" stroke-width="1.5"/>
  <rect x="884" y="372" width="236" height="72" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="1002" y="396" text-anchor="middle" font-size="13" font-weight="700" fill="#0F766E">RunCoordinator</text>
  <text x="1002" y="416" text-anchor="middle" font-size="11" fill="#475569">租约 / fence / checkpoint 推进</text>
  <text x="1002" y="434" text-anchor="middle" font-size="11" fill="#475569">need_input 停止 · 循环或收尾</text>

  <!-- notes -->
  <rect x="40" y="472" width="1080" height="106" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="60" y="496" font-size="12.5" font-weight="700" fill="#334155">容量与对账纪律</text>
  <text x="60" y="518" font-size="11.5" fill="#475569">· 共享同一物理引擎的所有模型 / Unit / worker 必须使用同一 backendId 与可信 backend.&lt;id&gt;.capacity；数据库锁定 backend 行认领推理槽</text>
  <text x="60" y="538" font-size="11.5" fill="#475569">· Python 处理期不占物理推理槽，实际推理期间占用；Unit 忙时推理留在持久队列，Cell 与心跳线程不等待推理</text>
  <text x="60" y="558" font-size="11.5" fill="#475569">· 超时 / 取消 / 断连只能结束观察，不能证明物理推理结束：无法确认时记 unknown、保留容量、禁止自动重发</text>
  <text x="60" y="574" font-size="11.5" fill="#475569">· Python 结果先写 journal 再报告，ACK 丢失可回放；迟到证据由当前 Coordinator 的 fence 对账，已发出的 run final 不改写</text>
</svg>
